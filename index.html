<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0f1a">
  <meta name="description" content="وَمضة — حكمة يومية من أقوال المفكرين والعلماء والأدباء.">
  <title>وَمضة — حكمة من كل حكاية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #f6f1e7;
      --muted: #b8b1c5;
      --gold: #e6c27a;
      --gold-bright: #f5dfa7;
      --glass: rgba(22, 20, 39, .72);
      --glass-border: rgba(255, 255, 255, .13);
      --ease: cubic-bezier(.2, .75, .25, 1);
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; background: #0d0f1a; }

    body {
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      font-family: "Cairo", sans-serif;
      background:
        radial-gradient(ellipse at 50% 22%, rgba(86, 53, 112, .24), transparent 46%),
        linear-gradient(145deg, #0d0f1a 4%, #121020 52%, #1b1233 100%);
      isolation: isolate;
    }

    button, a { font: inherit; }
    button { color: inherit; }

    .backdrop {
      position: fixed;
      z-index: -2;
      inset: -4%;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 44%, rgba(69, 48, 95, .35), transparent 58%),
        linear-gradient(145deg, #0d0f1a, #1b1233);
    }

    .backdrop::after {
      position: absolute;
      inset: 0;
      content: "";
      background:
        linear-gradient(180deg, rgba(13, 15, 26, .46), rgba(13, 15, 26, .72)),
        radial-gradient(ellipse at center, transparent 0%, rgba(13, 15, 26, .2) 74%, rgba(13, 15, 26, .5));
    }

    .backdrop img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(34px) saturate(.7);
      opacity: 0;
      transform: scale(1.12);
      transition: opacity 1.1s var(--ease);
    }

    .backdrop img.is-visible { opacity: .3; }

    .page {
      display: flex;
      min-height: 100svh;
      flex-direction: column;
      align-items: center;
      padding: 28px 18px 22px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      margin: 0 0 22px;
      color: var(--ink);
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 37px;
      height: 37px;
      place-items: center;
      border: 1px solid rgba(230, 194, 122, .55);
      border-radius: 50%;
      color: var(--gold);
      font-family: "Amiri", serif;
      font-size: 26px;
      line-height: 1;
      box-shadow: 0 0 25px rgba(230, 194, 122, .12), inset 0 0 15px rgba(230, 194, 122, .08);
    }

    .brand-copy { display: grid; gap: 0; }
    .brand-name { font-size: 18px; font-weight: 800; letter-spacing: .02em; }
    .brand-tagline { color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: .05em; }

    main {
      display: grid;
      width: min(100%, 790px);
      flex: 1;
      place-items: center;
    }

    .card {
      position: relative;
      width: 100%;
      padding: 26px 22px 24px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .065), rgba(255, 255, 255, .018) 40%, rgba(13, 12, 27, .14)),
        var(--glass);
      box-shadow: 0 26px 90px rgba(0, 0, 0, .36), inset 0 1px 0 rgba(255, 255, 255, .08);
      -webkit-backdrop-filter: blur(22px);
      backdrop-filter: blur(22px);
    }

    .card::before {
      position: absolute;
      top: 0;
      right: 14%;
      left: 14%;
      height: 1px;
      content: "";
      background: linear-gradient(90deg, transparent, rgba(230, 194, 122, .72), transparent);
    }

    .author-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .portrait-frame {
      position: relative;
      width: 142px;
      height: 142px;
      margin: 0 0 12px;
      overflow: hidden;
      border: 1px solid rgba(230, 194, 122, .7);
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 40%, rgba(230, 194, 122, .17), transparent 70%),
        linear-gradient(140deg, rgba(34, 27, 54, .96), rgba(15, 17, 31, .98));
      box-shadow: 0 0 0 6px rgba(230, 194, 122, .045), 0 0 38px rgba(230, 194, 122, .17);
    }

    .portrait-frame::before {
      position: absolute;
      z-index: 3;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: inherit;
      content: "";
      pointer-events: none;
    }

    .portrait-frame img {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      opacity: 0;
      transition: opacity .65s var(--ease);
    }

    .portrait-frame img.is-visible { opacity: 1; }

    .initials {
      position: absolute;
      z-index: 0;
      inset: 0;
      display: grid;
      place-items: center;
      color: transparent;
      background: linear-gradient(145deg, #fae5a9 4%, #d5a85a 48%, #9370b1 100%);
      background-clip: text;
      -webkit-background-clip: text;
      font-size: 47px;
      font-weight: 800;
      letter-spacing: -.08em;
      opacity: .94;
    }

    .portrait-frame.is-loading::after {
      position: absolute;
      z-index: 2;
      inset: 0;
      content: "";
      background: linear-gradient(110deg, transparent 20%, rgba(255, 255, 255, .18) 46%, transparent 72%);
      transform: translateX(100%);
      animation: shimmer 1.5s ease-in-out infinite;
    }

    @keyframes shimmer {
      to { transform: translateX(-100%); }
    }

    .image-credit {
      min-height: 20px;
      margin: -5px 0 16px;
      color: rgba(246, 241, 231, .56);
      font-size: 10px;
      font-weight: 500;
    }

    .image-credit a {
      color: inherit;
      text-decoration-color: rgba(230, 194, 122, .45);
      text-underline-offset: 3px;
      transition: color .2s ease;
    }

    .image-credit a:hover { color: var(--gold-bright); }
    .image-credit a:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 2px; }

    .author-name {
      margin: 0;
      color: var(--gold-bright);
      font-size: 19px;
      font-weight: 700;
      line-height: 1.5;
    }

    .author-bio {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.65;
    }

    .divider {
      width: 58px;
      height: 1px;
      margin: 20px auto 18px;
      background: linear-gradient(90deg, transparent, rgba(230, 194, 122, .7), transparent);
    }

    .quote-area {
      position: relative;
      padding: 0 7px;
      text-align: center;
      transition: opacity .22s ease, transform .22s ease;
    }

    .quote-area.is-changing {
      opacity: 0;
      transform: translateY(8px);
    }

    .quote-mark {
      height: 38px;
      color: rgba(230, 194, 122, .68);
      font-family: "Amiri", serif;
      font-size: 66px;
      line-height: .95;
      user-select: none;
    }

    blockquote {
      margin: 5px auto 0;
      color: var(--ink);
      font-family: "Amiri", serif;
      font-size: clamp(25px, 6vw, 39px);
      font-weight: 700;
      line-height: 1.75;
      text-wrap: pretty;
    }

    .source-note {
      margin: 12px 0 0;
      color: rgba(230, 194, 122, .66);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .025em;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 24px;
    }

    .action-button, .new-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform .18s var(--ease), background-color .2s ease, border-color .2s ease, box-shadow .2s ease, color .2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .action-button {
      min-width: 104px;
      min-height: 39px;
      padding: 8px 13px;
      border-color: rgba(255, 255, 255, .12);
      border-radius: 999px;
      background: rgba(255, 255, 255, .035);
      color: #d8d2df;
      font-size: 11px;
      font-weight: 600;
    }

    .action-button svg { width: 15px; height: 15px; flex: 0 0 auto; }
    .action-button:hover { border-color: rgba(230, 194, 122, .45); background: rgba(230, 194, 122, .08); color: var(--gold-bright); }

    .new-button {
      min-height: 52px;
      margin: 22px auto 0;
      padding: 0 28px;
      border-color: rgba(255, 237, 194, .38);
      border-radius: 999px;
      background: linear-gradient(110deg, #f1d99e, #d9b66f 55%, #ebce8f);
      color: #241b2e;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 7px 28px rgba(218, 181, 108, .2), inset 0 1px 0 rgba(255, 255, 255, .56);
    }

    .new-button svg { width: 18px; height: 18px; }
    .new-button:hover { transform: translateY(-2px); box-shadow: 0 11px 34px rgba(218, 181, 108, .28), inset 0 1px 0 rgba(255, 255, 255, .56); }
    .new-button:active, .action-button:active { transform: translateY(1px) scale(.98); }
    button:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 4px; }

    .keyboard-hint {
      margin: 13px 0 0;
      color: rgba(246, 241, 231, .48);
      font-size: 10px;
      text-align: center;
    }

    kbd {
      display: inline-block;
      min-width: 25px;
      padding: 0 5px;
      border: 1px solid rgba(255, 255, 255, .17);
      border-radius: 5px;
      color: rgba(246, 241, 231, .7);
      font: inherit;
      line-height: 1.8;
      text-align: center;
    }

    .toast {
      position: fixed;
      z-index: 10;
      right: 50%;
      bottom: 22px;
      max-width: calc(100vw - 28px);
      padding: 10px 17px;
      border: 1px solid rgba(230, 194, 122, .32);
      border-radius: 999px;
      background: rgba(22, 20, 39, .94);
      color: var(--ink);
      font-size: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
      opacity: 0;
      pointer-events: none;
      transform: translate(50%, 8px);
      transition: opacity .2s ease, transform .2s ease;
    }

    .toast.is-visible { opacity: 1; transform: translate(50%, 0); }

    .footer {
      margin-top: 22px;
      color: rgba(246, 241, 231, .4);
      font-size: 10px;
      text-align: center;
    }

    @media (min-width: 600px) {
      .page { padding: 35px 28px 26px; }
      .brand { margin-bottom: 24px; }
      .card { padding: 35px 52px 36px; border-radius: 34px; }
      .portrait-frame { width: 162px; height: 162px; margin-bottom: 14px; }
      .image-credit { margin-bottom: 18px; font-size: 11px; }
      .author-name { font-size: 21px; }
      .author-bio { font-size: 12px; }
      .divider { margin: 24px auto 20px; }
      .quote-area { padding: 0 14px; }
      .quote-mark { font-size: 74px; }
      .source-note { font-size: 11px; }
      .actions { gap: 12px; margin-top: 27px; }
      .action-button { min-width: 116px; min-height: 42px; font-size: 12px; }
      .new-button { min-height: 56px; margin-top: 25px; padding: 0 34px; font-size: 15px; }
    }

    @media (max-width: 380px) {
      .card { padding: 22px 16px 21px; border-radius: 24px; }
      .portrait-frame { width: 128px; height: 128px; }
      blockquote { font-size: 24px; line-height: 1.72; }
      .action-button { min-width: 0; padding-inline: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <img id="backdropA" alt="">
    <img id="backdropB" alt="">
  </div>

  <div class="page">
    <a class="brand" href="#" aria-label="وَمضة، الصفحة الرئيسية">
      <span class="brand-mark" aria-hidden="true">و</span>
      <span class="brand-copy">
        <span class="brand-name">وَمضة</span>
        <span class="brand-tagline">حكمة من كل حكاية</span>
      </span>
    </a>

    <main>
      <article class="card" aria-label="حكمة اليوم">
        <section class="author-block" aria-label="القائل">
          <div class="portrait-frame is-loading" id="portraitFrame">
            <span class="initials" id="initials" aria-hidden="true"></span>
            <img id="portraitA" alt="" aria-hidden="true">
            <img id="portraitB" alt="" aria-hidden="true">
          </div>
          <p class="image-credit"><a id="wikiCredit" href="https://en.wikipedia.org/" target="_blank" rel="noopener noreferrer">الصورة: ويكيبيديا</a></p>
          <h1 class="author-name" id="authorName"></h1>
          <p class="author-bio" id="authorBio"></p>
        </section>

        <div class="divider" aria-hidden="true"></div>

        <section class="quote-area" id="quoteArea" aria-live="polite" aria-atomic="true">
          <div class="quote-mark" aria-hidden="true">”</div>
          <blockquote id="quoteText"></blockquote>
          <p class="source-note" id="sourceNote"></p>
        </section>

        <div class="actions" aria-label="إجراءات الحكمة">
          <button class="action-button" id="copyButton" type="button" aria-label="نسخ الحكمة">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M16 8V5.8A1.8 1.8 0 0 0 14.2 4H5.8A1.8 1.8 0 0 0 4 5.8v8.4A1.8 1.8 0 0 0 5.8 16H8" stroke="currentColor" stroke-width="1.7"/></svg>
            <span>نسخ الحكمة</span>
          </button>
          <button class="action-button" id="shareButton" type="button" aria-label="مشاركة الحكمة">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="18" cy="5" r="2.5" stroke="currentColor" stroke-width="1.7"/><circle cx="6" cy="12" r="2.5" stroke="currentColor" stroke-width="1.7"/><circle cx="18" cy="19" r="2.5" stroke="currentColor" stroke-width="1.7"/><path d="m8.2 10.8 7.5-4.4M8.2 13.2l7.5 4.4" stroke="currentColor" stroke-width="1.7"/></svg>
            <span>مشاركة</span>
          </button>
        </div>

        <button class="new-button" id="newButton" type="button">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 7v5h-5M4.8 9.2A7.5 7.5 0 0 1 18.5 7M4 17v-5h5m10.2 2.8A7.5 7.5 0 0 1 5.5 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>حكمة جديدة</span>
        </button>
        <p class="keyboard-hint">أو اضغط <kbd>Space</kbd> لحكمة أخرى</p>
      </article>
    </main>

    <footer class="footer">أقوال مختارة من كتب ورسائل وخطب • <span id="libraryCount"></span></footer>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    // أضف الحكم هنا. حقل المرجع يوثّق أصل القول ويساعد على مراجعته.
    const wisdoms = [
      { text: "ما أمتع أن تتعلم شيئًا ثم تعاود ممارسته! وما أمتع أن يأتيك صديق من بعيد!", author: "كونفوشيوس", page: "Confucius", bio: "فيلسوف صيني • 551–479 ق.م", source: "المحاورات، 1.1" },
      { text: "ما لا ترغب أن يفعله الآخرون بك، لا تفعله بهم.", author: "كونفوشيوس", page: "Confucius", bio: "فيلسوف صيني • 551–479 ق.م", source: "المحاورات، 15.24" },
      { text: "أن تعرف ما تعرفه، وما لا تعرفه؛ تلك هي المعرفة الحقة.", author: "كونفوشيوس", page: "Confucius", bio: "فيلسوف صيني • 551–479 ق.م", source: "المحاورات، 2.17" },
      { text: "الانتصار الأسمى أن تكسر مقاومة العدو دون قتال.", author: "صن تزو", page: "Sun Tzu", bio: "استراتيجي عسكري صيني • القرن السادس ق.م (تقليديًا)", source: "فن الحرب، الفصل الثالث، ترجمة ليونيل جايلز" },
      { text: "إذا عرفت عدوك وعرفت نفسك، فلا تخشَ نتيجة مئة معركة.", author: "صن تزو", page: "Sun Tzu", bio: "استراتيجي عسكري صيني • القرن السادس ق.م (تقليديًا)", source: "فن الحرب، الفصل الثالث، ترجمة ليونيل جايلز" },
      { text: "المحاربون المهرة قديمًا كانوا يؤمّنون أنفسهم أولًا من الهزيمة، ثم ينتظرون فرصة هزيمة عدوهم.", author: "صن تزو", page: "Sun Tzu", bio: "استراتيجي عسكري صيني • القرن السادس ق.م (تقليديًا)", source: "فن الحرب، الفصل الرابع، ترجمة ليونيل جايلز" },
      { text: "الحرب، إذ تحرم الناس وفرة العيش اليومي، معلّم عنيف يكيّف طباعهم مع ما يفرضه الحاضر.", author: "ثوقيديدس", page: "Thucydides", bio: "مؤرخ وقائد عسكري يوناني • نحو 460–400 ق.م", source: "تاريخ الحرب البيلوبونيسية، 3.82.2" },
      { text: "الحرب ليست فعلًا سياسيًا فحسب، بل أداة سياسية واستمرار للتواصل السياسي بوسائل أخرى.", author: "كارل فون كلاوزفيتز", page: "Carl von Clausewitz", bio: "ضابط ومنظّر عسكري بروسي • 1780–1831", source: "عن الحرب، الكتاب الأول، الفصل الأول" },
      { text: "على البشرية أن تنهي الحروب، وإلا أنهت الحرب البشرية.", author: "جون كينيدي", page: "John F. Kennedy", bio: "رئيس أمريكي • 1917–1963", source: "خطاب أمام الجمعية العامة للأمم المتحدة، 25 سبتمبر 1961" },
      { text: "كل بندقية تُصنع، وكل سفينة حربية تُطلق، وكل صاروخ يُطلق، يسلب في النهاية قوتَ من يجوعون ولا يجدون الطعام.", author: "دوايت أيزنهاور", page: "Dwight D. Eisenhower", bio: "جنرال ورئيس أمريكي • 1890–1969", source: "خطاب «فرصة للسلام»، 16 أبريل 1953" },
      { text: "حين تعمّ الأسلحة، تصمت القوانين.", author: "شيشرون", page: "Cicero", bio: "خطيب ورجل دولة روماني • 106–43 ق.م", source: "الدفاع عن ميلو، الفقرة 11" },
      { text: "البداية هي أهم جزء في كل عمل.", author: "أفلاطون", page: "Plato", bio: "فيلسوف يوناني • 428–348 ق.م", source: "الجمهورية، الكتاب الثاني، 377a" },
      { text: "كل إنسان بطبيعته يتوق إلى المعرفة.", author: "أرسطو", page: "Aristotle", bio: "فيلسوف يوناني • 384–322 ق.م", source: "ما وراء الطبيعة، الكتاب الأول، 980a" },
      { text: "البداية، كما يُظن، أكثر من نصف العمل كله.", author: "أرسطو", page: "Aristotle", bio: "فيلسوف يوناني • 384–322 ق.م", source: "الأخلاق إلى نيقوماخوس، 1098b" },
      { text: "لا تزعج الناسَ الأشياءُ ذاتها، بل آراؤهم عنها.", author: "إبكتيتوس", page: "Epictetus", bio: "فيلسوف رواقي يوناني • نحو 50–135 م", source: "المختصر، الفصل 5" },
      { text: "إن لم يكن الأمر صوابًا، فلا تفعله؛ وإن لم يكن حقًا، فلا تقله.", author: "ماركوس أوريليوس", page: "Marcus Aurelius", bio: "إمبراطور روماني وفيلسوف رواقي • 121–180 م", source: "التأملات، الكتاب 12، الفقرة 17" },
      { text: "ليست حياتنا قصيرة، لكننا نهدر كثيرًا منها.", author: "سينيكا", page: "Seneca the Younger", bio: "فيلسوف وكاتب روماني • نحو 4 ق.م–65 م", source: "عن قِصر الحياة، الفصل 1" },
      { text: "طريق الوصايا طويل، أما طريق الأمثلة فقصير وفعّال.", author: "سينيكا", page: "Seneca the Younger", bio: "فيلسوف وكاتب روماني • نحو 4 ق.م–65 م", source: "الرسالة السادسة إلى لوكيليوس" },
      { text: "العلم كالماء والهواء؛ حق لكل مواطن أن يناله مجانًا.", author: "طه حسين", page: "Taha Hussein", bio: "أديب وناقد مصري • 1889–1973", source: "منسوب إليه في Bahgory: An Egyptian Artist’s Words and Pictures، 2008" },
      { text: "تعرف ذكاء المرء من إجاباته، وحكمته من أسئلته.", author: "نجيب محفوظ", page: "Naguib Mahfouz", bio: "روائي مصري حائز نوبل • 1911–2006", source: "منقول عنه في Thinking for a Change، 1996، ص. 96" },
      { text: "يقاربون الحب بدقة المحاسبين، في بلدٍ تقود العاطفةُ فيه السياسة.", author: "نجيب محفوظ", page: "Naguib Mahfouz", bio: "روائي مصري حائز نوبل • 1911–2006", source: "السكرية، 1957، كما ورد في ترجمتها الإنجليزية" },
      { text: "في أول الدولة، تجبي الضرائب إيرادًا كبيرًا من تكاليف قليلة؛ وفي آخرها، لا تجبي إلا القليل من تكاليف كبيرة.", author: "ابن خلدون", page: "Ibn Khaldun", bio: "مؤرخ ومفكر عربي • 1332–1406", source: "المقدمة، ترجمة فرانز روزنتال، ص. 355" },
      { text: "قد يتفوق التاجر المنظّم والمسؤول في تجارته على الحاكم الثري.", author: "ابن خلدون", page: "Ibn Khaldun", bio: "مؤرخ ومفكر عربي • 1332–1406", source: "المقدمة، المجلد الثاني، ص. 272–273" },
      { text: "أنا أفكر، إذن أنا موجود.", author: "رينيه ديكارت", page: "René Descartes", bio: "فيلسوف وعالم رياضيات فرنسي • 1596–1650", source: "مقال عن المنهج، الجزء الرابع، 1637" },
      { text: "ليس كافيًا أن يكون المرء عاقلًا؛ الأهم أن يُحسن استخدام عقله.", author: "رينيه ديكارت", page: "René Descartes", bio: "فيلسوف وعالم رياضيات فرنسي • 1596–1650", source: "مقال عن المنهج، الجزء الأول، 1637" },
      { text: "علينا أن نزرع حديقتنا.", author: "فولتير", page: "Voltaire", bio: "كاتب وفيلسوف فرنسي • 1694–1778", source: "كانديد، الفصل الأخير، 1759" },
      { text: "عملنا يحمينا من ثلاثة شرور: السأم والرذيلة والعوز.", author: "فولتير", page: "Voltaire", bio: "كاتب وفيلسوف فرنسي • 1694–1778", source: "كانديد، 1759" },
      { text: "لا يكفي أن نعرف، بل علينا أن نطبّق؛ ولا يكفي أن نريد، بل علينا أن نفعل.", author: "يوهان غوته", page: "Johann Wolfgang von Goethe", bio: "كاتب ومفكر ألماني • 1749–1832", source: "سنوات تجوال فلهلم مايستر، من أرشيف مكاري، الشذرة 324" },
      { text: "أُقرّ بأنه لا متعة تضاهي متعة القراءة!", author: "جين أوستن", page: "Jane Austen", bio: "روائية إنجليزية • 1775–1817", source: "كبرياء وتحامل، 1813" },
      { text: "لا سحر يضاهي رقة القلب.", author: "جين أوستن", page: "Jane Austen", bio: "روائية إنجليزية • 1775–1817", source: "إيما، 1815" },
      { text: "كل الأسر السعيدة تتشابه، أما كل أسرة تعيسة فتعيسة على طريقتها.", author: "ليو تولستوي", page: "Leo Tolstoy", bio: "روائي وفيلسوف روسي • 1828–1910", source: "آنا كارينينا، السطر الافتتاحي، 1878" },
      { text: "الجمال سينقذ العالم.", author: "فيودور دوستويفسكي", page: "Fyodor Dostoevsky", bio: "روائي روسي • 1821–1881", source: "الأبله، الجزء الثالث، الفصل الخامس" },
      { text: "نحن جميعًا في الحضيض، لكن بعضنا ينظر إلى النجوم.", author: "أوسكار وايلد", page: "Oscar Wilde", bio: "كاتب ومسرحي أيرلندي • 1854–1900", source: "مروحة الليدي ويندرمير، الفصل الثالث، 1892" },
      { text: "الخبرة هي الاسم الذي نطلقه على أخطائنا.", author: "أوسكار وايلد", page: "Oscar Wilde", bio: "كاتب ومسرحي أيرلندي • 1854–1900", source: "مروحة الليدي ويندرمير، الفصل الثالث، 1892" },
      { text: "الفعل الحسن خير من القول الحسن.", author: "بنجامين فرانكلين", page: "Benjamin Franklin", bio: "كاتب ومخترع ورجل دولة أمريكي • 1706–1790", source: "تقويم ريتشارد المسكين، 1737" },
      { text: "القرش الذي توفّره هو قرش تكسبه.", author: "بنجامين فرانكلين", page: "Benjamin Franklin", bio: "كاتب ومخترع ورجل دولة أمريكي • 1706–1790", source: "تقويم ريتشارد المسكين، 1758" },
      { text: "إذا كنت قد أبصرت أبعد، فذلك لأنني وقفت على أكتاف عمالقة.", author: "إسحاق نيوتن", page: "Isaac Newton", bio: "عالم فيزياء ورياضيات إنجليزي • 1643–1727", source: "رسالة إلى روبرت هوك، 15 فبراير 1676" },
      { text: "الخيال أهم من المعرفة؛ فالمعرفة محدودة، أما الخيال فيطوّق العالم.", author: "ألبرت أينشتاين", page: "Albert Einstein", bio: "عالم فيزياء ألماني المولد • 1879–1955", source: "مقابلة جورج فيريك، Saturday Evening Post، 1929" },
      { text: "أكثر ما يبعث على الدهشة في العالم أنه قابل للفهم.", author: "ألبرت أينشتاين", page: "Albert Einstein", bio: "عالم فيزياء ألماني المولد • 1879–1955", source: "مقال «الفيزياء والواقع»، 1936" },
      { text: "إن في هذه النظرة إلى الحياة لعظمةً وجلالًا.", author: "تشارلز داروين", page: "Charles Darwin", bio: "عالم طبيعة إنجليزي • 1809–1882", source: "أصل الأنواع، خاتمة الطبعة الأولى، 1859" },
      { text: "كتاب الطبيعة مكتوب بلغة الرياضيات.", author: "غاليليو غاليلي", page: "Galileo Galilei", bio: "عالم فلك وفيزياء إيطالي • 1564–1642", source: "الممحاة، الفصل السادس، 1623" },
      { text: "في بلاد العميان، الأعور ملك.", author: "إيراسموس", page: "Desiderius Erasmus", bio: "عالم إنسانيات هولندي • نحو 1466–1536", source: "الأمثال، 1500" },
      { text: "لا تكن صاحب مكتبة عامرة بالكتب، وأنت خالٍ من العلم.", author: "إيراسموس", page: "Desiderius Erasmus", bio: "عالم إنسانيات هولندي • 1466–1536", source: "رسالة إلى كريستيان نورتهوف، 1497" },
      { text: "حكومة الشعب، بالشعب، ومن أجل الشعب، لن تزول عن الأرض.", author: "أبراهام لينكولن", page: "Abraham Lincoln", bio: "رئيس أمريكي • 1809–1865", source: "خطاب غيتيسبيرغ، 19 نوفمبر 1863" },
      { text: "إن لم يكن هناك نضال، فلن يكون هناك تقدّم.", author: "فريدريك دوغلاس", page: "Frederick Douglass", bio: "كاتب وناشط أمريكي مناهض للعبودية • 1818–1895", source: "خطاب تحرير جزر الهند الغربية، 4 أغسطس 1857" },
      { text: "تعلّمت أن الشجاعة ليست غياب الخوف، بل الانتصار عليه.", author: "نيلسون مانديلا", page: "Nelson Mandela", bio: "قائد ورئيس جنوب أفريقي • 1918–2013", source: "من كتاب الاقتباسات المعتمد لمؤسسة نيلسون مانديلا، 2010" },
      { text: "في نهاية المطاف، نحن من يشكّل حياتنا ويشكّل أنفسنا.", author: "إليانور روزفلت", page: "Eleanor Roosevelt", bio: "كاتبة وناشطة أمريكية • 1884–1962", source: "قصتي، 1937؛ ويُعاد في مقدمة تعلّم بالحياة، 1960" },
      { text: "غاية الحياة أن نعيشها، وأن نذوق التجربة بلا خوف، وأن نطلب آفاقًا أوسع.", author: "إليانور روزفلت", page: "Eleanor Roosevelt", bio: "كاتبة وناشطة أمريكية • 1884–1962", source: "تعلّم بالحياة، المقدمة، 1960" },
      { text: "كم هو رائع ألّا يضطر أحد إلى الانتظار؛ يستطيع أن يبدأ الآن في تحسين العالم!", author: "آن فرانك", page: "Anne Frank", bio: "كاتبة يوميات ألمانية هولندية • 1929–1945", source: "يوميات آن فرانك، «أعطِ!»، 26 مارس 1944" },
      { text: "تحتاج المرأة إلى المال وغرفة تخصّها إن أرادت كتابة الرواية.", author: "فرجينيا وولف", page: "Virginia Woolf", bio: "روائية وناقدة إنجليزية • 1882–1941", source: "غرفة تخص المرء وحده، الفصل الأول، 1929" },
      { text: "نستطيع وحدنا أن نفعل القليل، ومعًا نستطيع أن نفعل الكثير.", author: "هيلين كيلر", page: "Helen Keller", bio: "كاتبة وناشطة أمريكية • 1880–1968", source: "هيلين ومعلمتها، جوزيف لاش، 1980" }
    ];

    const CACHE_PREFIX = "wamda-wiki-summary-v1:";
    const CACHE_MAX_AGE = 1000 * 60 * 60 * 24 * 30;
    const quoteArea = document.getElementById("quoteArea");
    const quoteText = document.getElementById("quoteText");
    const sourceNote = document.getElementById("sourceNote");
    const authorName = document.getElementById("authorName");
    const authorBio = document.getElementById("authorBio");
    const portraitFrame = document.getElementById("portraitFrame");
    const initials = document.getElementById("initials");
    const wikiCredit = document.getElementById("wikiCredit");
    const toast = document.getElementById("toast");
    const portraitImages = [document.getElementById("portraitA"), document.getElementById("portraitB")];
    const backdropImages = [document.getElementById("backdropA"), document.getElementById("backdropB")];
    let activePortrait = -1;
    let activeBackdrop = -1;
    let currentWisdom = null;
    let deck = [];
    let deckPosition = 0;
    let toastTimer = 0;
    const imagePromises = new Map();

    function fallbackPageUrl(page) {
      return "https://en.wikipedia.org/wiki/" + encodeURIComponent(page.replace(/ /g, "_"));
    }

    function readCachedSummary(page) {
      try {
        const raw = localStorage.getItem(CACHE_PREFIX + page);
        if (!raw) return null;
        const cached = JSON.parse(raw);
        if (!cached.savedAt || Date.now() - cached.savedAt > CACHE_MAX_AGE) return null;
        return cached.value || null;
      } catch (_) {
        return null;
      }
    }

    function writeCachedSummary(page, value) {
      try {
        localStorage.setItem(CACHE_PREFIX + page, JSON.stringify({ savedAt: Date.now(), value: value }));
      } catch (_) {
        // قد تكون مساحة التخزين ممتلئة أو معطّلة؛ تظل الصفحة قابلة للاستخدام.
      }
    }

    async function getWikipediaSummary(person) {
      const cached = readCachedSummary(person.page);
      if (cached) return cached;

      const endpoint = "https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(person.page);
      try {
        const response = await fetch(endpoint, { headers: { "Accept": "application/json" } });
        if (!response.ok) throw new Error("Wikipedia API returned " + response.status);
        const data = await response.json();
        const possibleImage = (data.thumbnail && data.thumbnail.source) || (data.originalimage && data.originalimage.source) || "";
        let image = "";
        if (possibleImage) {
          try {
            const parsedImage = new URL(possibleImage);
            if (parsedImage.protocol === "https:" && parsedImage.hostname.endsWith("wikimedia.org")) image = parsedImage.href;
          } catch (_) {
            image = "";
          }
        }
        const result = {
          image: image,
          pageUrl: (data.content_urls && data.content_urls.desktop && data.content_urls.desktop.page) || fallbackPageUrl(person.page)
        };
        writeCachedSummary(person.page, result);
        return result;
      } catch (_) {
        return { image: "", pageUrl: fallbackPageUrl(person.page) };
      }
    }

    function loadImage(url) {
      if (imagePromises.has(url)) return imagePromises.get(url);
      const promise = new Promise(function (resolve) {
        const image = new Image();
        image.onload = function () { resolve(true); };
        image.onerror = function () { resolve(false); };
        image.src = url;
        if (image.complete && image.naturalWidth > 0) resolve(true);
      });
      imagePromises.set(url, promise);
      return promise;
    }

    function initialsFor(name) {
      const parts = name.trim().split(/\s+/).filter(Boolean);
      if (parts.length > 1) return Array.from(parts[0])[0] + Array.from(parts[1])[0];
      return Array.from(name.trim()).slice(0, 2).join("");
    }

    function setImageLoading(isLoading) {
      portraitFrame.classList.toggle("is-loading", isLoading);
      portraitFrame.setAttribute("aria-busy", isLoading ? "true" : "false");
    }

    function showFallbackPortrait() {
      portraitImages.forEach(function (image) {
        image.classList.remove("is-visible");
        image.setAttribute("aria-hidden", "true");
      });
      activePortrait = -1;
      backdropImages.forEach(function (image) { image.classList.remove("is-visible"); });
      activeBackdrop = -1;
      initials.style.zIndex = "1";
      setImageLoading(false);
    }

    async function showPortrait(person) {
      initials.textContent = initialsFor(person.author);
      initials.style.zIndex = "1";
      setImageLoading(true);

      const info = await getWikipediaSummary(person);
      wikiCredit.href = info.pageUrl;
      wikiCredit.setAttribute("aria-label", "صفحة " + person.author + " على ويكيبيديا الإنجليزية");
      if (!info.image || !(await loadImage(info.image))) {
        showFallbackPortrait();
        return;
      }

      const portraitTarget = activePortrait === 0 ? 1 : 0;
      const backdropTarget = activeBackdrop === 0 ? 1 : 0;
      const portrait = portraitImages[portraitTarget];
      const backdrop = backdropImages[backdropTarget];
      portrait.alt = "صورة " + person.author;
      portrait.setAttribute("aria-hidden", "false");
      portrait.src = info.image;
      backdrop.src = info.image;
      initials.style.zIndex = "0";

      requestAnimationFrame(function () {
        portraitImages.forEach(function (image, index) {
          image.classList.toggle("is-visible", index === portraitTarget);
          if (index !== portraitTarget) image.setAttribute("aria-hidden", "true");
        });
        backdropImages.forEach(function (image, index) {
          image.classList.toggle("is-visible", index === backdropTarget);
        });
        activePortrait = portraitTarget;
        activeBackdrop = backdropTarget;
        setImageLoading(false);
      });
    }

    function shuffleDeck() {
      deck = wisdoms.map(function (_, index) { return index; });
      for (let i = deck.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      if (currentWisdom && deck.length > 1 && wisdoms[deck[0]] === currentWisdom) {
        [deck[0], deck[1]] = [deck[1], deck[0]];
      }
      deckPosition = 0;
    }

    function nextWisdom() {
      if (deckPosition >= deck.length) shuffleDeck();
      currentWisdom = wisdoms[deck[deckPosition]];
      deckPosition += 1;
      return currentWisdom;
    }

    function warmNextImage() {
      if (deckPosition >= deck.length) shuffleDeck();
      const upcoming = wisdoms[deck[deckPosition]];
      if (!upcoming) return;
      getWikipediaSummary(upcoming).then(function (info) {
        if (info.image) loadImage(info.image);
      });
    }

    function displayWisdom(wisdom) {
      quoteArea.classList.add("is-changing");
      authorName.textContent = wisdom.author;
      authorBio.textContent = wisdom.bio;
      quoteText.textContent = wisdom.text;
      sourceNote.textContent = wisdom.source;
      document.title = wisdom.author + " — وَمضة";
      showPortrait(wisdom);
      window.setTimeout(function () {
        requestAnimationFrame(function () { quoteArea.classList.remove("is-changing"); });
      }, 35);
      warmNextImage();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("is-visible");
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(function () { toast.classList.remove("is-visible"); }, 2100);
    }

    function currentShareText() {
      return "«" + currentWisdom.text + "» — " + currentWisdom.author + "\nمن وَمضة";
    }

    async function copyWisdom() {
      const text = currentShareText();
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const field = document.createElement("textarea");
          field.value = text;
          field.setAttribute("readonly", "");
          field.style.position = "fixed";
          field.style.opacity = "0";
          document.body.appendChild(field);
          field.select();
          const copied = document.execCommand("copy");
          field.remove();
          if (!copied) throw new Error("Copy command failed");
        }
        showToast("نُسخت الحكمة");
      } catch (_) {
        showToast("تعذّر النسخ في هذا المتصفح");
      }
    }

    async function shareWisdom() {
      const text = currentShareText();
      if (navigator.share) {
        try {
          await navigator.share({ title: "حكمة من وَمضة", text: text });
        } catch (error) {
          if (error && error.name !== "AbortError") showToast("تعذّرت المشاركة");
        }
        return;
      }
      const whatsappUrl = "https://wa.me/?text=" + encodeURIComponent(text);
      window.open(whatsappUrl, "_blank", "noopener,noreferrer");
    }

    document.getElementById("libraryCount").textContent = wisdoms.length + " حكمة";
    document.getElementById("newButton").addEventListener("click", function () {
      displayWisdom(nextWisdom());
    });
    document.getElementById("copyButton").addEventListener("click", copyWisdom);
    document.getElementById("shareButton").addEventListener("click", shareWisdom);
    document.addEventListener("keydown", function (event) {
      const target = event.target;
      const interactive = target && target.closest && target.closest("button, a, input, textarea, select, [contenteditable='true']");
      if (event.code === "Space" && !event.repeat && !event.altKey && !event.ctrlKey && !event.metaKey && !interactive) {
        event.preventDefault();
        displayWisdom(nextWisdom());
      }
    });

    shuffleDeck();
    displayWisdom(nextWisdom());
  </script>
</body>
</html>
